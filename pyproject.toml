[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-scheduler-monitor"
version = "0.1.0"
description = "Heroku one-off dyno (Scheduler / Advanced Scheduler / manual run) monitoring dashboard for Django, powered by your existing log drain."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Petr Dlouhý", email = "petr.dlouhy@email.cz" }]
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
keywords = ["heroku", "scheduler", "monitoring", "dyno", "cron", "django", "axiom"]

[project.urls]
Homepage = "https://github.com/PetrDlouhy/django-scheduler-monitor"
Issues = "https://github.com/PetrDlouhy/django-scheduler-monitor/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-django"]

[tool.hatch.build.targets.wheel]
packages = ["scheduler_monitor"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
